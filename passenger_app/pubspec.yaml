name: passenger_app
description: Passenger App for Live Bus Tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  fl_chart: ^1.2.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
